<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translatarr - Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --primary-color: #3b82f6;
            --text-main: #f8fafc;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .navbar {
            background: rgba(15, 23, 42, 0.8) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .navbar-brand {
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.5rem;
        }
        .card {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            max-width: 800px;
            margin: 0 auto;
        }
        .card-header {
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-weight: 600;
        }
        .form-control, .form-select {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .form-control:focus, .form-select:focus {
            background-color: rgba(15, 23, 42, 0.9);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
            color: white;
        }
        .btn-primary {
            background: linear-gradient(to right, #3b82f6, #6366f1);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            padding: 10px 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        label {
            font-weight: 600;
            margin-bottom: 4px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Translatarr</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Jobs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/settings">Settings</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <h1>Settings</h1>
        <hr>
        <form action="/settings" method="post">
            <div class="mb-3">
                <label>OpenAI API Key</label>
                <input type="password" name="openai_api_key" class="form-control" value="{{ settings.get('openai_api_key', '') }}">
            </div>
            <div class="mb-3">
                <label>LLM Model (e.g. gpt-4, gpt-3.5-turbo)</label>
                <input type="text" name="llm_model" class="form-control" value="{{ settings.get('llm_model', 'gpt-3.5-turbo') }}">
            </div>
            <div class="mb-3">
                <label>Custom Base URL (For Ollama / Local Models)</label>
                <input type="text" name="base_url" class="form-control" value="{{ settings.get('base_url', '') }}">
                <small class="text-muted">Leave blank if using official OpenAI</small>
            </div>
            
            <h3 class="mt-4">Auto-Import Defaults</h3>
            <div class="mb-3">
                <label>Target Language</label>
                <input type="text" name="auto_lang" class="form-control" value="{{ settings.get('auto_lang', 'Spanish') }}">
            </div>
            <div class="mb-3">
                <label>Language Code</label>
                <input type="text" name="auto_lang_code" class="form-control" value="{{ settings.get('auto_lang_code', 'spa') }}">
            </div>
            <div class="mb-3">
                <label>Generate Audio (TTS)</label>
                <select name="auto_generate_audio" class="form-control">
                    <option value="false" {% if settings.get('auto_generate_audio') != 'true' %}selected{% endif %}>No</option>
                    <option value="true" {% if settings.get('auto_generate_audio') == 'true' %}selected{% endif %}>Yes</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Replace Original MKV File</label>
                <select name="auto_replace_original" class="form-control">
                    <option value="false" {% if settings.get('auto_replace_original') != 'true' %}selected{% endif %}>No (Create a new file)</option>
                    <option value="true" {% if settings.get('auto_replace_original') == 'true' %}selected{% endif %}>Yes (Overwrite original file)</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary mt-3">Save Settings</button>
        </form>
    </div>
</body>
</html>
